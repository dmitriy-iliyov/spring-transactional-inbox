spring:
  application:
    name: notification-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:notifications}
    username: ${DB_USER:inbox}
    password: ${DB_PASSWORD:inbox}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    properties:
      # JavaMail waits forever by default; a hanging mail server would stall the listener thread
      mail.smtp.connectiontimeout: ${SMTP_CONNECT_TIMEOUT_MS:5000}
      mail.smtp.timeout: ${SMTP_READ_TIMEOUT_MS:10000}
      mail.smtp.writetimeout: ${SMTP_WRITE_TIMEOUT_MS:10000}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    listener:
      type: batch
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 50
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

notification:
  mail:
    from: ${MAIL_FROM:orders@example.com}

oncebox:
  thread-pool-size: 2
  tables:
    auto-create: true
  distributed-lock:
    resolve-by-polling-properties: true
  outbox:
    enabled: false
  inbox:
    enabled: true
    source:
      type: kafka
    mappings:
      order-created: io.github.inbox.contract.OrderCreatedEvent
      order-cancelled: io.github.inbox.contract.OrderCancelledEvent
    clean-up:
      enabled: true
      # longer than a record can stay readable on orders.events (retention 7d + segment roll 1d), so the inbox still
      # knows every event a rewound consumer can be handed again
      ttl: 14d
      polling:
        initial-delay: 1m
    metrics:
      enabled: true

app:
  version: '@project.version@'
  instance-id: ${HOSTNAME:local}
  environment: ${DEPLOY_ENV:local}
  logging:
    json:
      enabled: ${LOG_JSON_ENABLED:false}
      path: ${LOG_JSON_PATH:./logs}
