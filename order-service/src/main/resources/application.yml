spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:orders}
    username: ${DB_USER:inbox}
    password: ${DB_PASSWORD:inbox}
    hikari:
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  jackson:
    default-property-inclusion: non_null
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true

server:
  port: ${SERVER_PORT:8080}

oncebox:
  thread-pool-size: 7
  tables:
    auto-create: true
  distributed-lock:
    resolve-by-polling-properties: true
  outbox:
    sender:
      type: kafka
      bean-name: kafkaTemplate
    defaults:
      batch-size: 200
      polling:
        type: adaptive
        initial-delay: 5s
        min-fixed-delay: 250ms
        max-fixed-delay: 5s
        multiplier: 1.5
      max-retries: 5
      backoff:
        enabled: true
        delay: 5s
        multiplier: 2.0
    events:
      order-created:
        topic: orders.events
      order-cancelled:
        topic: orders.events
    stuck-recovery:
      polling:
        initial-delay: 30s
    clean-up:
      enabled: true
      ttl: 1h
      polling:
        initial-delay: 1m
    dlq:
      enabled: true

app:
  version: '@project.version@'
  instance-id: ${HOSTNAME:local}
  environment: ${DEPLOY_ENV:local}
  logging:
    json:
      enabled: ${LOG_JSON_ENABLED:false}
      path: ${LOG_JSON_PATH:./logs}
